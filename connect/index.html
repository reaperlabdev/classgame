<!doctype html>
<html>
    <head>
        <title>Connect</title>
    </head>
    <style>
        * {
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #121212;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            background-color: #000;
        }
        h1 {
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.5);
            color: #fff;
        }
        h2 {
            text-shadow: 2px 2px 4px rgba(152, 251, 152, 0.5);
            color: palegreen;
            text-decoration: underline;
        }
    </style>
    <body>
        <div class="container">
            <h1>Play our game</h1>
            <h2 id="url">. . .</h2>
        </div>
    </body>
    <script>
        const origin = window.location.origin;
        document.getElementById("url").innerText = origin;
    </script>
</html>
