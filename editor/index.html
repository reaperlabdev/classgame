<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tile Map Editor</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --bg0: #0f1117;
                --bg1: #1a1d27;
                --bg2: #22263a;
                --bg3: #2c3150;
                --border: #333755;
                --border2: #444c6e;
                --text: #e2e6f0;
                --text2: #8b90a8;
                --text3: #555a75;
                --accent: #4f7fff;
                --accent-dim: #1e2e5c;
                --accent-text: #a5bdff;
                --rad: 8px;
                --rad-sm: 5px;
            }
            body {
                background: var(--bg0);
                color: var(--text);
                font-family: system-ui, sans-serif;
                font-size: 13px;
            }
            #app {
                display: flex;
                height: 100vh;
                overflow: hidden;
            }
            #sidebar {
                width: 200px;
                min-width: 200px;
                background: var(--bg1);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow-y: auto;
            }
            #sidebar-header {
                padding: 14px 14px 10px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.08em;
                color: var(--text3);
                text-transform: uppercase;
            }
            #tile-palette {
                padding: 0 10px 10px;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
            }
            .tile-card {
                border: 1.5px solid var(--border);
                border-radius: var(--rad-sm);
                cursor: pointer;
                overflow: hidden;
                transition:
                    border-color 0.12s,
                    transform 0.1s;
                background: var(--bg2);
            }
            .tile-card:hover {
                border-color: var(--border2);
                transform: scale(1.02);
            }
            .tile-card.active {
                border-color: var(--accent);
                background: var(--accent-dim);
            }
            .tile-preview {
                height: 44px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .tile-label {
                font-size: 11px;
                font-weight: 500;
                text-align: center;
                padding: 4px 0 5px;
                color: var(--text2);
                border-top: 1px solid var(--border);
            }
            .tile-card.active .tile-label {
                color: var(--accent-text);
            }
            .side-sep {
                height: 1px;
                background: var(--border);
                margin: 8px 10px;
            }
            .side-section {
                padding: 8px 10px;
            }
            .side-title {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.06em;
                color: var(--text3);
                text-transform: uppercase;
                margin-bottom: 8px;
            }
            .side-row {
                display: flex;
                align-items: center;
                gap: 6px;
                margin-bottom: 6px;
            }
            .side-row label {
                font-size: 12px;
                color: var(--text2);
                width: 14px;
            }
            .side-row input[type="number"] {
                flex: 1;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: var(--rad-sm);
                color: var(--text);
                padding: 5px 7px;
                font-size: 12px;
                min-width: 0;
            }
            .side-row input[type="number"]:focus {
                outline: none;
                border-color: var(--accent);
            }
            .btn {
                display: block;
                width: 100%;
                padding: 7px;
                font-size: 12px;
                font-weight: 500;
                border-radius: var(--rad-sm);
                border: 1px solid var(--border);
                background: var(--bg2);
                color: var(--text);
                cursor: pointer;
                transition:
                    background 0.1s,
                    border-color 0.1s;
                margin-bottom: 5px;
                text-align: center;
            }
            .btn:hover {
                background: var(--bg3);
                border-color: var(--border2);
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn-accent {
                background: var(--accent-dim);
                border-color: var(--accent);
                color: var(--accent-text);
            }
            .btn-accent:hover {
                background: #243570;
            }
            #main {
                flex: 1;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            #topbar {
                background: var(--bg1);
                border-bottom: 1px solid var(--border);
                padding: 8px 12px;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                min-height: 44px;
            }
            #topbar-title {
                font-size: 12px;
                font-weight: 600;
                color: var(--text2);
                margin-right: 4px;
            }
            #canvas-area {
                flex: 1;
                overflow: auto;
                display: flex;
                align-items: flex-start;
                justify-content: flex-start;
                background: var(--bg0);
                padding: 16px;
            }
            #canvas-wrap {
                border: 1px solid var(--border);
                border-radius: var(--rad);
                overflow: hidden;
                line-height: 0;
            }
            canvas {
                display: block;
                cursor: crosshair;
            }
            #bottombar {
                background: var(--bg1);
                border-top: 1px solid var(--border);
                padding: 8px 12px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            #json-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            #json-label {
                font-size: 11px;
                color: var(--text3);
                white-space: nowrap;
            }
            #btn-export-sm,
            #btn-import-sm,
            #btn-copy-sm {
                padding: 4px 10px;
                font-size: 11px;
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: var(--rad-sm);
                color: var(--text2);
                cursor: pointer;
                white-space: nowrap;
                transition: background 0.1s;
            }
            #btn-export-sm:hover,
            #btn-import-sm:hover,
            #btn-copy-sm:hover {
                background: var(--bg3);
            }
            #status-text {
                font-size: 11px;
                color: var(--accent-text);
                margin-left: 4px;
            }
            #json-out {
                width: 100%;
                height: 72px;
                font-family: monospace;
                font-size: 11px;
                padding: 7px 9px;
                border: 1px solid var(--border);
                border-radius: var(--rad-sm);
                background: var(--bg0);
                color: var(--text2);
                resize: none;
                outline: none;
            }
            #json-out:focus {
                border-color: var(--border2);
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="sidebar">
                <div id="sidebar-header">Tiles</div>
                <div id="tile-palette">
                    <div class="tile-card active" data-tile="0">
                        <div class="tile-preview">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <rect width="32" height="32" fill="#3a7a28" />
                                <rect
                                    x="4"
                                    y="6"
                                    width="6"
                                    height="3"
                                    rx="1"
                                    fill="#2d6020"
                                    opacity=".7"
                                />
                                <rect
                                    x="14"
                                    y="10"
                                    width="8"
                                    height="3"
                                    rx="1"
                                    fill="#2d6020"
                                    opacity=".5"
                                />
                                <rect
                                    x="6"
                                    y="17"
                                    width="5"
                                    height="3"
                                    rx="1"
                                    fill="#4a9a34"
                                    opacity=".6"
                                />
                                <rect
                                    x="18"
                                    y="20"
                                    width="7"
                                    height="3"
                                    rx="1"
                                    fill="#2d6020"
                                    opacity=".6"
                                />
                            </svg>
                        </div>
                        <div class="tile-label">Grass</div>
                    </div>
                    <div class="tile-card" data-tile="1">
                        <div class="tile-preview">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <rect width="32" height="32" fill="#5a5a66" />
                                <circle cx="9" cy="10" r="4" fill="#444450" />
                                <circle cx="22" cy="14" r="5" fill="#4a4a56" />
                                <circle cx="11" cy="22" r="3" fill="#3e3e4a" />
                                <circle cx="24" cy="23" r="3" fill="#505060" />
                            </svg>
                        </div>
                        <div class="tile-label">Rock</div>
                    </div>
                    <div class="tile-card" data-tile="2">
                        <div class="tile-preview">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <rect width="32" height="32" fill="#b8924a" />
                                <rect
                                    x="2"
                                    y="7"
                                    width="28"
                                    height="4"
                                    fill="#9a7535"
                                    opacity=".4"
                                />
                                <rect
                                    x="2"
                                    y="14"
                                    width="28"
                                    height="3"
                                    fill="#c8a250"
                                    opacity=".35"
                                />
                                <rect
                                    x="2"
                                    y="21"
                                    width="28"
                                    height="4"
                                    fill="#9a7535"
                                    opacity=".4"
                                />
                            </svg>
                        </div>
                        <div class="tile-label">Path</div>
                    </div>
                    <div class="tile-card" data-tile="3">
                        <div class="tile-preview">
                            <svg width="32" height="32" viewBox="0 0 32 32">
                                <rect width="32" height="32" fill="#1e5ea0" />
                                <path
                                    d="M2 12 Q10 9 18 12 Q26 15 30 12"
                                    stroke="#60a8e8"
                                    stroke-width="1.5"
                                    fill="none"
                                    opacity=".8"
                                />
                                <path
                                    d="M2 19 Q8 16 16 19 Q24 22 30 19"
                                    stroke="#80c4f4"
                                    stroke-width="1.2"
                                    fill="none"
                                    opacity=".6"
                                />
                            </svg>
                        </div>
                        <div class="tile-label">Water</div>
                    </div>
                </div>

                <div class="side-sep"></div>
                <div class="side-section">
                    <div class="side-title">Map size</div>
                    <div class="side-row">
                        <label>W</label
                        ><input
                            id="inp-w"
                            type="number"
                            value="50"
                            min="5"
                            max="120"
                        />
                    </div>
                    <div class="side-row">
                        <label>H</label
                        ><input
                            id="inp-h"
                            type="number"
                            value="32"
                            min="5"
                            max="80"
                        />
                    </div>
                    <button class="btn btn-accent" id="btn-resize">
                        Resize map
                    </button>
                </div>

                <div class="side-sep"></div>
                <div class="side-section">
                    <div class="side-title">Actions</div>
                    <button class="btn" id="btn-fill">
                        Fill borders with rock
                    </button>
                    <button class="btn" id="btn-clear">Clear map</button>
                </div>
            </div>

            <div id="main">
                <div id="topbar">
                    <span id="topbar-title">Tile Map Editor</span>
                    <span
                        id="coord-display"
                        style="
                            font-size: 11px;
                            color: var(--text3);
                            font-family: monospace;
                        "
                        >—</span
                    >
                </div>
                <div id="canvas-area">
                    <div id="canvas-wrap"><canvas id="c"></canvas></div>
                </div>
                <div id="bottombar">
                    <div id="json-row">
                        <span id="json-label">JSON</span>
                        <button id="btn-export-sm">Export</button>
                        <button id="btn-import-sm">Import</button>
                        <button id="btn-copy-sm">Copy</button>
                        <span id="status-text"></span>
                    </div>
                    <textarea
                        id="json-out"
                        spellcheck="false"
                        placeholder="Export to see output, or paste JSON here to import..."
                    ></textarea>
                </div>
            </div>
        </div>

        <script>
            const TS = 14;
            const COLORS = {
                0: "#3a7a28",
                1: "#5a5a66",
                2: "#b8924a",
                3: "#1e5ea0",
            };
            const DARK = {
                0: "#2d6020",
                1: "#444450",
                2: "#9a7535",
                3: "#154880",
            };
            const TILE_TYPES = { 0: "grass", 1: "rock", 2: "path", 3: "water" };
            let W = 50,
                H = 32,
                grid = [],
                activeTile = 0,
                painting = false,
                lastCell = null,
                waveOffset = 0,
                animFrame = null;
            const canvas = document.getElementById("c");
            const ctx = canvas.getContext("2d");

            function initGrid(w, h, fill = 0) {
                W = w;
                H = h;
                grid = [];
                for (let y = 0; y < H; y++) {
                    grid.push([]);
                    for (let x = 0; x < W; x++) grid[y].push(fill);
                }
            }
            function resizeCanvas() {
                canvas.width = W * TS;
                canvas.height = H * TS;
            }

            function draw() {
                for (let y = 0; y < H; y++) {
                    for (let x = 0; x < W; x++) {
                        const t = grid[y][x];
                        ctx.fillStyle = COLORS[t] || "#333";
                        ctx.fillRect(x * TS, y * TS, TS, TS);
                        ctx.strokeStyle = DARK[t] || "#222";
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(
                            x * TS + 0.25,
                            y * TS + 0.25,
                            TS - 0.5,
                            TS - 0.5,
                        );
                        if (t === 2) {
                            ctx.fillStyle = "rgba(255,255,255,0.12)";
                            ctx.fillRect(
                                x * TS + 2,
                                y * TS + TS / 2 - 0.5,
                                TS - 4,
                                2,
                            );
                        }
                        if (t === 3) {
                            const ph =
                                (waveOffset + x * 0.6 + y * 0.3) %
                                (Math.PI * 2);
                            const wy = Math.sin(ph) * 1.4;
                            ctx.strokeStyle = "rgba(100,180,255,.55)";
                            ctx.lineWidth = 1.1;
                            ctx.beginPath();
                            ctx.moveTo(x * TS + 2, y * TS + TS / 2 + wy);
                            ctx.quadraticCurveTo(
                                x * TS + TS / 2,
                                y * TS + TS / 2 + wy - 2,
                                x * TS + TS - 2,
                                y * TS + TS / 2 + wy,
                            );
                            ctx.stroke();
                        }
                    }
                }
            }

            function hasWater() {
                for (let y = 0; y < H; y++)
                    for (let x = 0; x < W; x++)
                        if (grid[y][x] === 3) return true;
                return false;
            }
            function animate() {
                waveOffset += 0.07;
                draw();
                animFrame = hasWater() ? requestAnimationFrame(animate) : null;
            }
            function startAnim() {
                if (hasWater() && !animFrame)
                    animFrame = requestAnimationFrame(animate);
            }
            function stopAnim() {
                if (!hasWater() && animFrame) {
                    cancelAnimationFrame(animFrame);
                    animFrame = null;
                    draw();
                }
            }

            function cellFromEvent(e) {
                const r = canvas.getBoundingClientRect();
                const sx = canvas.width / r.width,
                    sy = canvas.height / r.height;
                const x = Math.floor(((e.clientX - r.left) * sx) / TS);
                const y = Math.floor(((e.clientY - r.top) * sy) / TS);
                if (x < 0 || y < 0 || x >= W || y >= H) return null;
                return { x, y };
            }
            function paint(cell) {
                if (!cell) return;
                if (lastCell && lastCell.x === cell.x && lastCell.y === cell.y)
                    return;
                grid[cell.y][cell.x] = activeTile;
                lastCell = cell;
                if (!animFrame) draw();
                startAnim();
                stopAnim();
            }
            function updateCoord(cell) {
                document.getElementById("coord-display").textContent = cell
                    ? `x:${cell.x} y:${cell.y}`
                    : "—";
            }

            canvas.addEventListener("mousedown", (e) => {
                painting = true;
                lastCell = null;
                paint(cellFromEvent(e));
            });
            canvas.addEventListener("mousemove", (e) => {
                const c = cellFromEvent(e);
                updateCoord(c);
                if (painting) paint(c);
            });
            canvas.addEventListener("mouseup", () => (painting = false));
            canvas.addEventListener("mouseleave", () => {
                painting = false;
                updateCoord(null);
            });
            canvas.addEventListener(
                "touchstart",
                (e) => {
                    e.preventDefault();
                    painting = true;
                    lastCell = null;
                    paint(cellFromEvent(e.touches[0]));
                },
                { passive: false },
            );
            canvas.addEventListener(
                "touchmove",
                (e) => {
                    e.preventDefault();
                    if (painting) paint(cellFromEvent(e.touches[0]));
                },
                { passive: false },
            );
            canvas.addEventListener("touchend", () => (painting = false));

            document.querySelectorAll("[data-tile]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    activeTile = parseInt(btn.dataset.tile);
                    document
                        .querySelectorAll("[data-tile]")
                        .forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                });
            });

            document
                .getElementById("btn-resize")
                .addEventListener("click", () => {
                    const nw = parseInt(document.getElementById("inp-w").value);
                    const nh = parseInt(document.getElementById("inp-h").value);
                    if (!nw || !nh) return;
                    if (animFrame) {
                        cancelAnimationFrame(animFrame);
                        animFrame = null;
                    }
                    initGrid(nw, nh);
                    resizeCanvas();
                    draw();
                });
            document
                .getElementById("btn-fill")
                .addEventListener("click", () => {
                    for (let x = 0; x < W; x++) {
                        grid[0][x] = 1;
                        grid[H - 1][x] = 1;
                    }
                    for (let y = 0; y < H; y++) {
                        grid[y][0] = 1;
                        grid[y][W - 1] = 1;
                    }
                    if (!animFrame) draw();
                    startAnim();
                    stopAnim();
                });
            document
                .getElementById("btn-clear")
                .addEventListener("click", () => {
                    if (animFrame) {
                        cancelAnimationFrame(animFrame);
                        animFrame = null;
                    }
                    initGrid(W, H, 0);
                    draw();
                });

            function buildJSON() {
                return {
                    tileSize: 16,
                    width: W,
                    height: H,
                    tileTypes: TILE_TYPES,
                    layers: [{ name: "ground", data: grid.map((r) => [...r]) }],
                };
            }
            function setStatus(msg) {
                const el = document.getElementById("status-text");
                el.textContent = msg;
                setTimeout(() => (el.textContent = ""), 2000);
            }

            document
                .getElementById("btn-export-sm")
                .addEventListener("click", () => {
                    document.getElementById("json-out").value = JSON.stringify(
                        buildJSON(),
                        null,
                        2,
                    );
                    setStatus("Exported");
                });
            document
                .getElementById("btn-import-sm")
                .addEventListener("click", () => {
                    try {
                        const data = JSON.parse(
                            document.getElementById("json-out").value,
                        );
                        if (animFrame) {
                            cancelAnimationFrame(animFrame);
                            animFrame = null;
                        }
                        W = data.width;
                        H = data.height;
                        document.getElementById("inp-w").value = W;
                        document.getElementById("inp-h").value = H;
                        if (
                            data.layers &&
                            data.layers[0] &&
                            data.layers[0].data
                        )
                            grid = data.layers[0].data.map((r) => [...r]);
                        else if (data.tiles)
                            grid = data.tiles.map((r) => [...r]);
                        else throw new Error("bad format");
                        resizeCanvas();
                        draw();
                        startAnim();
                        setStatus("Loaded");
                    } catch {
                        setStatus("Invalid JSON");
                    }
                });
            document
                .getElementById("btn-copy-sm")
                .addEventListener("click", () => {
                    const v = document.getElementById("json-out").value;
                    if (!v) {
                        setStatus("Nothing to copy");
                        return;
                    }
                    navigator.clipboard
                        .writeText(v)
                        .then(() => setStatus("Copied"));
                });

            initGrid(W, H);
            resizeCanvas();
            draw();
        </script>
    </body>
</html>
