<!doctype html>
<html>
    <head>
        <title>Robot Defense</title>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <style>
            * {
                touch-action: none;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
            body {
                background-color: #121212;
                margin: 0;
                padding: 0;
                overflow: hidden;
                position: fixed;
                width: 100%;
                height: 100%;
            }
            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
            }
            canvas {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
                background-color: #000;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <canvas width="800" height="512" id="gameCanvas"></canvas>
        </div>
        <audio id="audiohandler" style="display: none" controls>
            Your browser does not support the audio element.
        </audio>
        <script src="./bundle.js"></script>
    </body>
</html>
